<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ON — Phrasal Verb Workout</title>
<style>
:root{--ink:#18233e;--muted:#61708c;--paper:#f5f7fc;--card:#fff;--blue:#3559df;--blue2:#eaf0ff;--lime:#c9f36b;--line:#e4e9f2;--good:#16845b;--bad:#c44352;--shadow:0 18px 50px #24335712}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 4%,#e8edff 0,transparent 30%),var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);line-height:1.5}.wrap{max-width:1040px;margin:auto;padding:34px 22px 60px}.hero{position:relative;overflow:hidden;padding:35px 38px 30px;border-radius:26px;background:#18264b;color:white;box-shadow:var(--shadow)}.hero:after{content:"ON";position:absolute;right:20px;top:-45px;font-size:210px;font-weight:900;color:#ffffff08;letter-spacing:-18px;pointer-events:none}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:800;color:var(--lime)}h1{font-size:clamp(30px,5vw,48px);line-height:1.05;margin:10px 0 12px;letter-spacing:-.04em}.hero p{max-width:650px;color:#d1d9ed;margin:0;font-size:16px}.progress-row{display:flex;align-items:center;gap:12px;margin-top:24px;max-width:490px}.progress{height:9px;flex:1;background:#ffffff24;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:var(--lime);transition:width .3s}.score{font-size:13px;color:#e5eaff;font-weight:700;white-space:nowrap}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:14px;padding:13px 12px;text-align:left;font:inherit;font-size:13px;font-weight:800;cursor:pointer;transition:.2s}.tab span{display:block;color:#a0abc0;font-size:11px;margin-bottom:3px}.tab:hover{transform:translateY(-2px);border-color:#bbc8f8}.tab.active{background:var(--blue);border-color:var(--blue);color:white;box-shadow:0 8px 18px #3559df30}.tab.active span{color:#cdd7ff}.panel{background:var(--card);border:1px solid var(--line);border-radius:23px;padding:28px;box-shadow:var(--shadow);min-height:405px}.panel-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.kicker{color:var(--blue);font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.12em}.panel h2{margin:5px 0 4px;font-size:25px;letter-spacing:-.025em}.panel-head p,.sub{margin:0;color:var(--muted);font-size:14px}.pill{display:inline-flex;align-items:center;background:var(--blue2);color:#294cc9;border-radius:100px;padding:6px 11px;font-size:12px;font-weight:800;white-space:nowrap}.verb{font-size:21px;font-weight:850;letter-spacing:-.02em}.muted{color:var(--muted)}.flash-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:stretch}.flashcard{border:0;cursor:pointer;text-align:left;min-height:210px;width:100%;padding:26px;border-radius:19px;background:linear-gradient(135deg,#edf1ff,#f7f8ff);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s,background .2s}.flashcard:hover{transform:translateY(-2px)}.flashcard.flipped{background:linear-gradient(135deg,#eaf8d2,#f5ffe9)}.flashcard .big{font-size:clamp(25px,4vw,36px);font-weight:900;letter-spacing:-.04em}.flashcard .meaning{font-size:20px;font-weight:750}.flashcard .example{font-size:14px;color:var(--muted);margin-top:12px}.flash-controls{display:flex;flex-direction:column;justify-content:center;gap:12px}.flash-controls p{color:var(--muted);font-size:14px}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--blue);color:white;font:inherit;font-weight:800;cursor:pointer;transition:.18s}.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}.btn.secondary{background:#edf0f7;color:#34405d}.btn.ghost{background:transparent;color:var(--blue);border:1px solid #d7def5}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.match-col{display:grid;gap:10px}.match-item{width:100%;min-height:62px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);padding:12px 15px;text-align:left;font:inherit;cursor:pointer;transition:.15s}.match-item:hover{border-color:#9aaaf3;background:#f9faff}.match-item.selected{border:2px solid var(--blue);background:var(--blue2)}.match-item.matched{border-color:#9cdabb;background:#edfbf3;color:#246848;cursor:default}.match-item.wrong{animation:shake .25s;border-color:#f1a0a7;background:#fff1f2}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.match-item .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:#f0f2f8;color:#74809a;font-size:11px;font-weight:900;margin-right:8px}.question{padding:19px;border-radius:16px;background:#f7f8fc;margin:12px 0;border:1px solid #edf0f6}.qnum{font-size:11px;color:var(--blue);text-transform:uppercase;letter-spacing:.1em;font-weight:900}.qtext{font-size:17px;font-weight:650;margin:8px 0 15px}.options{display:grid;gap:8px}.option{display:block;text-align:left;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff;font:inherit;color:var(--ink);cursor:pointer}.option:hover{border-color:#9aaaf3}.option.correct{background:#eaf9f0;border-color:#79c99e;color:#176241}.option.incorrect{background:#fff0f1;border-color:#e99aa2;color:#9e3340}.option:disabled{cursor:default}.feedback{min-height:22px;margin:9px 0 0;font-size:13px;font-weight:750}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}.typebox{display:flex;gap:9px;margin-top:14px}.typebox input{flex:1;min-width:0;border:1px solid #dce2ee;border-radius:12px;padding:13px 14px;font:inherit;color:var(--ink);outline:none}.typebox input:focus{border-color:#8297f2;box-shadow:0 0 0 3px #3559df16}.hint{font-size:13px;color:var(--muted);margin-top:11px}.answer-reveal{font-size:13px;color:#34405d;background:#f1f4fb;border-radius:11px;padding:11px 13px;margin-top:10px}.results{font-weight:800;color:var(--blue);margin-left:auto;align-self:center;font-size:13px}.bottom{margin-top:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:12px}.bottom button{border:0;background:none;color:var(--blue);font:inherit;font-weight:800;cursor:pointer;padding:8px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){.wrap{padding:18px 13px 35px}.hero{padding:26px 23px}.hero:after{font-size:145px;top:-18px}.tabs{grid-template-columns:repeat(2,1fr);gap:8px}.tab{padding:11px}.panel{padding:20px 16px}.panel-head{display:block}.pill{margin-top:12px}.flash-wrap{grid-template-columns:1fr}.flash-controls{display:grid;grid-template-columns:1fr 1fr}.flash-controls p{grid-column:1/-1}.match-grid{gap:8px}.match-item{padding:10px;font-size:13px}.typebox{flex-direction:column}.bottom{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow">A quick practice set · 6 verbs · 4 activities</div>
<h1>Get these verbs<br>to stick.</h1>
<p>Learn the meanings, connect each verb to its definition, then use them in context. Read <b>on</b> as part of the phrasal verb—not just a preposition.</p>
<div class="progress-row"><div class="progress" aria-label="Practice progress"><span id="progressFill"></span></div><div class="score" id="scoreText">0 of 12 correct</div></div>
</header>
<nav class="tabs" aria-label="Choose an activity">
<button class="tab active" data-activity="1"><span>ACTIVITY 01</span>Flashcards</button>
<button class="tab" data-activity="2"><span>ACTIVITY 02</span>Match meanings</button>
<button class="tab" data-activity="3"><span>ACTIVITY 03</span>Choose the verb</button>
<button class="tab" data-activity="4"><span>ACTIVITY 04</span>Recall & type</button>
</nav>
<main class="panel" id="panel" aria-live="polite"></main>
<div class="bottom"><span>Tip: say each answer aloud before you reveal or check it.</span><button id="resetAll">↻ Reset all activity progress</button></div>
</div>
<script>
const verbs=[
 {phrase:'pass something on',short:'pass sth on',meaning:'give or transfer something to another person',example:'We passed the old baby clothes on to my brother’s family.',cue:'give something to someone else'},
 {phrase:'carry on',short:'carry on',meaning:'continue doing something',example:'They carried on with the nomadic lifestyle.',cue:'continue'},
 {phrase:'hold on',short:'hold on',meaning:'wait for a short time',example:'Please hold on while I check the flight times.',cue:'wait'},
 {phrase:'get on (well) with someone',short:'get on (well)',meaning:'have a good relationship with someone',example:'Sean has always got on well with his neighbours.',cue:'have a good relationship'},
 {phrase:'look on',short:'look on',meaning:'watch an event without taking part',example:'The security guard looked on as we queued.',cue:'watch'},
 {phrase:'catch on',short:'catch on',meaning:'become popular or widely understood',example:'Sam thinks veganism will catch on.',cue:'become popular'}
];
const panel=document.getElementById('panel');let activity=1,flashIndex=0,flipped=false,matchSelected=null,matched=new Set(),mcIndex=0,mcScore=0,typeIndex=0,typeScore=0,correctTotal=0;
const mcQuestions=[
 {text:'The check-in assistant said, “Please ___ while I check the flight times.”',answer:'hold on',opts:['hold on','look on','catch on'],why:'Hold on means “wait for a short time.”'},
 {text:'Sean has always ___ well ___ his neighbours.',answer:'got on … with',opts:['got on … with','carried on … with','caught on … to'],why:'Get on well with someone means to have a good relationship.'},
 {text:'Sam thinks veganism will ___ all around the country.',answer:'catch on',opts:['catch on','hold on','pass on'],why:'Catch on means “become popular.”'},
 {text:'The security guard ___ as people queued at check-in.',answer:'looked on',opts:['looked on','carried on','got on'],why:'Look on means to watch without taking part.'},
 {text:'We ___ the clothes ___ to my brother’s family.',answer:'passed … on',opts:['passed … on','held … on','looked … on'],why:'Pass something on means to give or transfer it to someone else.'},
 {text:'They ___ with their traditional way of life.',answer:'carried on',opts:['carried on','caught on','held on'],why:'Carry on means “continue.”'}
];
const typeQuestions=[
 {q:'The receptionist asked Rob to ______ while she checked the flight times.',a:'hold on',hint:'It means “wait.”'},
 {q:'Sean has always ______ well with his neighbours.',a:'got on',hint:'Past form of “get on”; the sentence already includes “well with.”'},
 {q:'Sam doubts that the new trend will ______ all around the country.',a:'catch on',hint:'It means “become popular.”'},
 {q:'The security guard ______ as we queued up.',a:'looked on',hint:'Past form of a verb meaning “watch.”'},
 {q:'We ______ the baby clothes ______ to my brother’s family.',a:'passed|on',hint:'Two words go in the blanks: past form of “pass” … “on.”'},
 {q:'A lot of Mongolians ______ the nomadic lifestyle.',a:'carry on',hint:'Use the base form after “A lot of Mongolians”; it means “continue.”'}
];
function setProgress(n){correctTotal=Math.min(12,correctTotal+n);document.getElementById('scoreText').textContent=correctTotal+' of 12 correct';document.getElementById('progressFill').style.width=(correctTotal/12*100)+'%'}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',+b.dataset.activity===activity));if(activity===1)renderFlash();if(activity===2)renderMatch();if(activity===3)renderMC();if(activity===4)renderType()}
function renderFlash(){const v=verbs[flashIndex];panel.innerHTML=`<div class="panel-head"><div><div class="kicker">Activity 01 · Learn the set</div><h2>Flashcards</h2><p>Try to remember the meaning before you flip the card.</p></div><span class="pill">CARD ${flashIndex+1} / 6</span></div><div class="flash-wrap"><button class="flashcard ${flipped?'flipped':''}" id="flipCard" aria-label="Flip flashcard"><div class="big">${flipped?v.meaning:v.phrase}</div><div>${flipped?`<div class="example">“${v.example}”</div>`:`<div class="muted">Tap to reveal the meaning + example ↗</div>`}</div></button><div class="flash-controls"><p><b>Memory trick:</b> picture the action as you say the phrase. Then make a new sentence of your own.</p><button class="btn" id="nextCard">${flashIndex===5?'Start again':'Next card'} →</button><button class="btn secondary" id="shuffleCards">↻ Shuffle cards</button></div></div>`;document.getElementById('flipCard').onclick=()=>{flipped=!flipped;renderFlash()};document.getElementById('nextCard').onclick=()=>{flashIndex=(flashIndex+1)%verbs.length;flipped=false;renderFlash()};document.getElementById('shuffleCards').onclick=()=>{flashIndex=Math.floor(Math.random()*verbs.length);flipped=false;renderFlash()}}
function renderMatch(){const order=[3,0,5,2,1,4];panel.innerHTML=`<div class="panel-head"><div><div class="kicker">Activity 02 · Make the connection</div><h2>Match each verb to its meaning</h2><p>Tap one phrasal verb, then tap its definition.</p></div><span class="pill">${matched.size} / 6 matched</span></div><div class="match-grid"><div class="match-col">${verbs.map((v,i)=>`<button class="match-item ${matched.has(i)?'matched':''} ${matchSelected===i?'selected':''}" data-v="${i}" ${matched.has(i)?'disabled':''}><span class="n">${i+1}</span><b>${v.phrase}</b></button>`).join('')}</div><div class="match-col">${order.map((idx,j)=>`<button class="match-item ${matched.has(idx)?'matched':''}" data-m="${idx}" ${matched.has(idx)?'disabled':''}><span class="n">${String.fromCharCode(65+j)}</span>${verbs[idx].meaning}</button>`).join('')}</div></div><div class="feedback" id="matchFeedback" aria-live="polite">${matched.size===6?'Perfect match! Move on and practise them in sentences.':'Choose a pair to begin.'}</div><div class="btn-row"><button class="btn secondary" id="resetMatch">↻ Try matching again</button></div>`;
panel.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{matchSelected=+b.dataset.v;document.getElementById('matchFeedback').textContent='Now select the matching meaning.';renderMatch()});panel.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(matchSelected===null){document.getElementById('matchFeedback').textContent='Select a phrasal verb first.';return}const idx=+b.dataset.m,fb=document.getElementById('matchFeedback');if(idx===matchSelected){matched.add(idx);setProgress(1);matchSelected=null;fb.className='feedback good';fb.textContent='Correct! '+verbs[idx].short+' — '+verbs[idx].meaning+'.';renderMatch()}else{fb.className='feedback bad';fb.textContent='Not quite—try another definition.';b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),350)}});document.getElementById('resetMatch').onclick=()=>{matched.clear();matchSelected=null;renderMatch()}}
function renderMC(){if(mcIndex>=mcQuestions.length){panel.innerHTML=`<div class="panel-head"><div><div class="kicker">Activity 03 · Put it in context</div><h2>Round complete!</h2><p>You scored ${mcScore} out of ${mcQuestions.length} on this round.</p></div><span class="pill">NICE WORK</span></div><p class="question">${mcScore===6?'Fantastic—every answer is right.':mcScore>=4?'Great work. Review any tricky pair, then play again.':'Good start. Say the meanings aloud and give it another go.'}</p><button class="btn" id="againMC">↻ Play again</button>`;document.getElementById('againMC').onclick=()=>{mcIndex=0;mcScore=0;renderMC()};return}const q=mcQuestions[mcIndex];panel.innerHTML=`<div class="panel-head"><div><div class="kicker">Activity 03 · Put it in context</div><h2>Choose the best phrasal verb</h2><p>Use the clue in the sentence to pick the natural phrase.</p></div><span class="pill">QUESTION ${mcIndex+1} / 6</span></div><div class="question"><div class="qnum">Choose one answer</div><div class="qtext">${q.text}</div><div class="options">${q.opts.map((o,i)=>`<button class="option" data-i="${i}">${o}</button>`).join('')}</div><div id="mcFeedback" class="feedback" aria-live="polite"></div></div><button class="btn" id="nextMC" disabled>${mcIndex===5?'See result':'Next question'} →</button>`;
let answered=false;panel.querySelectorAll('.option').forEach((b,i)=>b.onclick=()=>{if(answered)return;answered=true;const ok=q.opts[i]===q.answer;const fb=document.getElementById('mcFeedback');b.classList.add(ok?'correct':'incorrect');panel.querySelectorAll('.option').forEach((x,j)=>{x.disabled=true;if(q.opts[j]===q.answer)x.classList.add('correct')});fb.className='feedback '+(ok?'good':'bad');fb.textContent=(ok?'Correct! ':'Not this one. ')+q.why;if(ok){mcScore++;setProgress(1)}document.getElementById('nextMC').disabled=false});document.getElementById('nextMC').onclick=()=>{mcIndex++;renderMC()}}
function norm(s){return s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z| ]/g,'').trim().replace(/\s+/g,' ')}
function renderType(){if(typeIndex>=typeQuestions.length){panel.innerHTML=`<div class="panel-head"><div><div class="kicker">Activity 04 · Retrieve from memory</div><h2>Recall round complete!</h2><p>You recalled ${typeScore} out of ${typeQuestions.length} answers.</p></div><span class="pill">${typeScore} / 6</span></div><p class="question">${typeScore>=5?'Excellent recall—these are starting to stick.':'Retrieval gets easier with practice. Review the flashcards and try once more.'}</p><button class="btn" id="againType">↻ Practise again</button>`;document.getElementById('againType').onclick=()=>{typeIndex=0;typeScore=0;renderType()};return}const q=typeQuestions[typeIndex];panel.innerHTML=`<div class="panel-head"><div><div class="kicker">Activity 04 · Retrieve from memory</div><h2>Type the missing phrase</h2><p>No choices this time. Recall the verb and type it in.</p></div><span class="pill">PROMPT ${typeIndex+1} / 6</span></div><div class="question"><div class="qnum">Complete the sentence</div><div class="qtext">${q.q}</div><form id="typeForm" class="typebox"><label class="sr" for="typed">Your phrasal verb</label><input id="typed" autocomplete="off" placeholder="Type the phrasal verb…"/><button class="btn" id="checkType">Check</button></form><div class="hint" id="typeHint">Need a nudge? <button class="btn ghost" type="button" id="showHint">Show hint</button></div><div class="feedback" id="typeFeedback" aria-live="polite"></div><div id="typeReveal"></div></div><button class="btn" id="nextType" disabled>${typeIndex===5?'See result':'Next prompt'} →</button>`;
let answered=false;const form=document.getElementById('typeForm'),input=document.getElementById('typed');form.onsubmit=e=>{e.preventDefault();if(answered)return;answered=true;const expected=q.a.split('|').join(' '),ok=norm(input.value)===norm(expected);const fb=document.getElementById('typeFeedback');fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?'Exactly right!':`Almost. The answer is “${expected}”.`;if(ok){typeScore++;setProgress(1)}document.getElementById('typeReveal').innerHTML=`<div class="answer-reveal"><b>Remember:</b> ${verbs[typeIndex].meaning}.<br><i>${verbs[typeIndex].example}</i></div>`;input.disabled=true;document.getElementById('checkType').disabled=true;document.getElementById('nextType').disabled=false};document.getElementById('showHint').onclick=()=>{document.getElementById('typeHint').textContent='Hint: '+q.hint};document.getElementById('nextType').onclick=()=>{typeIndex++;renderType()};input.focus()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activity=+b.dataset.activity;render()});document.getElementById('resetAll').onclick=()=>{flashIndex=0;flipped=false;matchSelected=null;matched.clear();mcIndex=0;mcScore=0;typeIndex=0;typeScore=0;correctTotal=0;document.getElementById('scoreText').textContent='0 of 12 correct';document.getElementById('progressFill').style.width='0%';activity=1;render()};render();
</script>
</body>
</html>
